<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Portal</title>
    <style>
    body {
      margin: 20px;
      background: #f4f4f4;
    }
    .container {
      background: #fff;
      padding: 20px;
      width: 40%;
      margin: auto;
      border-radius: 8px;
    }
    p {
        margin: 0;
    }
    input {
      width: 95%;
      padding: 8px;
      margin: 10px 0;
      outline: none;
    }
    button {
      padding: 10px 15px;
      margin: 10px 5px 0 0;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      border-radius: 5px;
      background: #e2e2ff;
    }
    .error {
      background-color: #ffe0e0;
      color: red;
      margin-top: 10px;
      padding: 15px;
      border-radius: 12px;
      }
    </style>
  </head>
  <body>

    <div class="container">
      <h2>Student Result Portal</h2>
      <p>Student Name*</p>
      <input type="text" id="name" placeholder="Enter Student Name" />
      <p>Subject1*</p>
      <input type="text" id="subject1" placeholder=" Enter Marks for Subject 1" />
      <p>Subject2*</p>
      <input type="text" id="subject2" placeholder="Enter Marks for Subject 2" />
      <p>Subject3*</p>
      <input type="text" id="subject3" placeholder="Enter Marks for Subject 3" />

      <button onclick="calculateResult()">Calculate</button>
      <button id="reset">Reset</button>

      <div id="result"></div>
      <div class="error" id="error"></div>
    </div>

    <script src="student-portal.js"></script>
  </body>
</html>
